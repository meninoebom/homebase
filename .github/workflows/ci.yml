name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebase
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Format and lint
        run: vp check

      # vp 0.0.0's `vp check` doesn't yet run tsc; running typecheck
      # explicitly so TypeScript errors gate the merge. Drop this step once
      # vp check folds typecheck in.
      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: vp test run --passWithNoTests
