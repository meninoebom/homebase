name: CI

# PR-only. The required `check` is produced by the PR run, so re-running on the
# squash-merge commit (push) was pure duplication. deploy.yml fires on push:main
# independently, so deploys are unaffected. See
# ~/.claude/knowledge-base/github-actions-cost-control.md
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homebase
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Format and lint
        run: vp check

      # vp 0.0.0's `vp check` doesn't yet run tsc; running typecheck
      # explicitly so TypeScript errors gate the merge. Drop this step once
      # vp check folds typecheck in.
      - name: Typecheck
        # vp 0.0.0 has no `vp typecheck` builtin; `vp run typecheck`
        # forwards to the package.json script (tsc --noEmit).
        run: vp run typecheck

      - name: Run tests
        run: vp test run --passWithNoTests
