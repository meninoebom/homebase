[package]
name = "app"
version = "0.1.0"
description = "morning-ritual — personal daily writing workspace"
authors = ["Brandon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
# Enable tauri's `test` module (MockRuntime, mock_context, noop_assets) for
# unit tests of commands/log.rs. This feature is NOT enabled in production
# builds — dev-dependencies are only merged in during `cargo test`.
tauri = { version = "2", features = ["test"] }

