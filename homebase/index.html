<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A2618" />
    <title>Homebase: a journal structured by time</title>

    <!--
      Link-preview metadata. Without these a shared link unfurls as the bare
      word "Homebase" and no image, which is most of what makes a shared link
      go unclicked. og:image must be an absolute URL — unfurlers do not
      resolve relative paths. Keep this copy in sync with public/welcome/.
    -->
    <meta
      name="description"
      content="A journal structured by time, from your values down to today. Plain markdown in a folder you own. No account, no server, nothing to install."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homebase" />
    <meta property="og:url" content="https://homebase.you/" />
    <meta property="og:title" content="Homebase: a journal structured by time" />
    <meta
      property="og:description"
      content="A journal structured by time, from your values down to today. Plain markdown in a folder you own. No account, no server, nothing to install."
    />
    <meta property="og:image" content="https://homebase.you/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Homebase. Your journal, in plain markdown, in a folder you own."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Homebase: a journal structured by time" />
    <meta
      name="twitter:description"
      content="A journal structured by time, from your values down to today. Plain markdown in a folder you own. No account, no server, nothing to install."
    />
    <meta name="twitter:image" content="https://homebase.you/og.png" />
  </head>

  <body>
    <div id="root"></div>
    <!--
      SPA fallback restoration. Pairs with public/404.html. If we got here
      via the GitHub Pages 404 → root redirect, the original path lives in
      a "?/" query segment; decode it and rewrite history BEFORE React or
      TanStack Router boot, so the router sees the correct URL.
      Reference: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
